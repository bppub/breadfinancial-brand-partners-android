name: CI

on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Format, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      # Keep this check first: failures stop the job before build/test work.
      - name: Lint Kotlin
        run: ./Scripts/format.sh --check

      - name: Build SDK release
        run: ./gradlew :BreadPartnersSDK:assembleRelease

      - name: Run SDK unit tests with coverage
        run: ./gradlew :BreadPartnersSDK:testDebugUnitTest :BreadPartnersSDK:createDebugUnitTestCoverageReport

      # Hardware acceleration for the Android emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run SDK instrumented tests with coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: ./gradlew :BreadPartnersSDK:connectedDebugAndroidTest :BreadPartnersSDK:createDebugAndroidTestCoverageReport

      - name: Publish combined coverage check run
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const escapeCell = value => String(value ?? "").replace(/\|/g, "\\|");
            const coverageDir = path.join(
              process.env.GITHUB_WORKSPACE,
              "BreadPartnersSDK",
              "build",
              "reports",
              "coverage"
            );
            const reportPaths = [
              path.join(coverageDir, "test", "debug", "report.xml"),
              path.join(coverageDir, "androidTest", "debug", "connected", "report.xml")
            ];
            for (const reportPath of reportPaths) {
              if (!fs.existsSync(reportPath)) {
                throw new Error(`Coverage report not found: ${reportPath}`);
              }
            }

            // JaCoCo XML: <package name="a/b"> ... <sourcefile name="X.kt"> ... <line nr="1" mi="0" ci="2" .../>
            // A line counts as covered if it was covered by either the unit or the instrumented run.
            const linesByFile = new Map();
            const packagePattern = /<package name="([^"]*)">([\s\S]*?)<\/package>/g;
            const sourceFilePattern = /<sourcefile name="([^"]*)">([\s\S]*?)<\/sourcefile>/g;
            const linePattern = /<line nr="(\d+)" mi="(\d+)" ci="(\d+)"/g;

            for (const reportPath of reportPaths) {
              const xml = fs.readFileSync(reportPath, "utf8");
              for (const packageMatch of xml.matchAll(packagePattern)) {
                const packageName = packageMatch[1];
                for (const fileMatch of packageMatch[2].matchAll(sourceFilePattern)) {
                  const filePath = `${packageName}/${fileMatch[1]}`;
                  const lines = linesByFile.get(filePath) || new Map();
                  for (const lineMatch of fileMatch[2].matchAll(linePattern)) {
                    const lineNumber = Number(lineMatch[1]);
                    const covered = Number(lineMatch[3]) > 0;
                    lines.set(lineNumber, (lines.get(lineNumber) || false) || covered);
                  }
                  linesByFile.set(filePath, lines);
                }
              }
            }

            const files = Array.from(linesByFile.entries())
              .map(([name, lines]) => {
                const coveredLines = Array.from(lines.values()).filter(Boolean).length;
                return {
                  name,
                  coveredLines,
                  executableLines: lines.size,
                  lineCoverage: lines.size === 0 ? 0 : coveredLines / lines.size
                };
              })
              .filter(file => file.executableLines > 0)
              .sort((left, right) => left.lineCoverage - right.lineCoverage);

            if (files.length === 0) {
              throw new Error(`No source files found in coverage reports: ${reportPaths.join(", ")}`);
            }

            const percent = value => `${(value * 100).toFixed(2)}%`;
            const coveredLines = files.reduce((total, file) => total + file.coveredLines, 0);
            const executableLines = files.reduce((total, file) => total + file.executableLines, 0);
            const lineCoverage = coveredLines / executableLines;
            const rows = files.map(file =>
              `| ${escapeCell(file.name)} | ${percent(file.lineCoverage)} | ${file.coveredLines} / ${file.executableLines} |`
            );
            const text = [
              "| Metric | Value |",
              "| --- | ---: |",
              `| Line Coverage | **${percent(lineCoverage)}** |`,
              `| Covered Lines | ${coveredLines} |`,
              `| Executable Lines | ${executableLines} |`,
              `| Files in Report | ${files.length} |`,
              `| Workflow Run | ${context.runId} |`,
              `| Commit | ${context.sha.slice(0, 7)} |`,
              "",
              "### Lowest Coverage Files",
              "| File | Coverage | Covered / Executable |",
              "| --- | ---: | ---: |",
              ...rows,
              "",
            ].join("\n");

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Coverage (Combined)",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Combined Coverage",
                summary: `Line coverage (unit + instrumented tests): **${percent(lineCoverage)}**`,
                text
              }
            });
      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: BreadPartnersSDK/build/reports/androidTests/
