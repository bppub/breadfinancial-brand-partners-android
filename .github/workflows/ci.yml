name: CI

on:
  pull_request:

jobs:
  quality:
    name: Format, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      # Keep these checks first: failures stop the job before build/test work.
      - name: Check Kotlin formatting
        run: ./Scripts/format.sh --check

      - name: Lint Kotlin
        run: ./Scripts/lint.sh

      - name: Build SDK release
        run: ./gradlew :BreadPartnersSDK:assembleRelease
